<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Plain elements default to black text in Premiere's UXP. Use the host theme's colours, with a
       light grey for Premiere's usual dark theme if the host doesn't provide them. */
    body { font-family: sans-serif; font-size: 12px; padding: 8px;
           color: var(--uxp-host-text-color, #d6d6d6); }
    #log, #status, #root { color: var(--uxp-host-text-color, #d6d6d6); }
    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    #filter { flex: 1; }
    #root { opacity: 0.8; word-break: break-all; }
    #status { padding: 6px 8px; margin-bottom: 6px; border-radius: 4px; border: 1px solid #555; }
    #status.running { border-color: #5b8fd6; }
    #status.done-ok { border-color: #3a9c5a; background: rgba(58, 156, 90, 0.18); }
    #status.done-fail { border-color: #c64a4a; background: rgba(198, 74, 74, 0.18); }
    #status-title { font-weight: bold; }
    #status-detail { opacity: 0.85; margin-top: 2px; word-break: break-all; }
    #bar-track { height: 8px; background: #3a3a3a; border-radius: 4px; margin-top: 6px; overflow: hidden; }
    #bar-fill { height: 8px; width: 0%; background: #5b8fd6; }
    #status.done-ok #bar-fill { background: #3a9c5a; }
    #status.done-fail #bar-fill { background: #c64a4a; }
    #log { font-family: monospace; white-space: pre-wrap; height: 260px; overflow: auto; border: 1px solid #555; padding: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <sp-button id="choose" variant="secondary">Corpus folder…</sp-button>
    <span id="root">(not chosen)</span>
  </div>
  <div class="row">
    <sp-textfield id="filter" placeholder="case id filter (regex, empty = all)"></sp-textfield>
    <sp-button id="run" variant="cta">Run</sp-button>
  </div>
  <div id="status">
    <div id="status-title">Idle</div>
    <div id="status-detail">Choose the corpus folder (once; it is remembered), then Run. The panel doesn't update during a run (about a minute for all cases); the result shows here when it's done.</div>
    <div id="bar-track"><div id="bar-fill"></div></div>
  </div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
