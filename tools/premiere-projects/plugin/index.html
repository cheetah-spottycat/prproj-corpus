<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; padding: 8px; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    #filter { flex: 1; }
    #root { opacity: 0.8; word-break: break-all; }
    #log { font-family: monospace; white-space: pre-wrap; height: 300px; overflow: auto; border: 1px solid #555; padding: 4px; }
  </style>
</head>
<body>
  <div class="row">
    <sp-button id="choose" variant="secondary">Corpus folder…</sp-button>
    <span id="root">(not chosen)</span>
  </div>
  <div class="row">
    <sp-textfield id="filter" placeholder="case id filter (regex, empty = all)"></sp-textfield>
    <sp-button id="run" variant="cta">Run</sp-button>
  </div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
